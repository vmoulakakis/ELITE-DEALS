name: Inspect deployment payload

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/inspect-payload.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload
        shell: bash
        run: |
          set -euo pipefail
          echo 'Payload parts:'
          ls -1 deploy-payload/part-*.txt
          cat $(find deploy-payload -maxdepth 1 -type f -name 'part-*.txt' | sort) | tr -d '\r\n' > payload.b64
          base64 -d payload.b64 > payload.gz
          gzip -t payload.gz
          gzip -dc payload.gz > payload.bin
          echo "Decoded size: $(wc -c < payload.bin) bytes"
          echo "File type: $(file -b payload.bin)"
          xxd -l 64 payload.bin
      - name: Inspect archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          if tar -tf payload.bin >/tmp/list.txt 2>/dev/null; then
            echo 'FORMAT=TAR'
            cat /tmp/list.txt
            tar -xf payload.bin -C extracted
          elif unzip -t payload.bin >/dev/null 2>&1; then
            echo 'FORMAT=ZIP'
            unzip -l payload.bin
            unzip -q payload.bin -d extracted
          else
            echo 'FORMAT=PLAIN'
            head -160 payload.bin || true
            cp payload.bin extracted/payload.bin
          fi
          echo '--- extracted tree ---'
          find extracted -maxdepth 6 -type f -printf '%P\n' | sort
      - name: Upload decoded payload
        uses: actions/upload-artifact@v4
        with:
          name: decoded-payload
          path: extracted
